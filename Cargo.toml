[package]
name = "mitos-gui"
version = "0.1.0"
edition = "2021"
authors = ["Shark <banor3331@gmail.com>"]
description = "Lightweight, glass-inspired Wayland compositor and desktop environment for MITOS"
license = "MIT"

[dependencies]
# Wayland compositor framework
smithay = "0.3"

# Event loop
calloop = "0.12"

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

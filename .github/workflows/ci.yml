name: Build MITOS GUI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-mitos-gui:
    name: Build MITOS GUI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libgbm-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libpixman-1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-shm0-dev \
            libxcb-xkb-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mitos-gui-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mitos-gui-

      - name: Check MITOS GUI
        run: cargo check --all-targets

      - name: Build MITOS GUI
        run: cargo build --release

      - name: Prepare artifact
        run: |
          mkdir -p mitos-gui-artifact
          cp target/release/mitos-gui mitos-gui-artifact/
          cp Cargo.toml mitos-gui-artifact/
          cp Cargo.lock mitos-gui-artifact/

      - name: Upload MITOS GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitos-gui-linux-x86_64
          path: mitos-gui-artifact/
          retention-days: 30
          if-no-files-found: error
